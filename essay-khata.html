nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));gap:6px;z-index:6}

footer{margin-top:24px;color:var(--muted);font-size:15px}

@media (prefers-reduced-motion:reduce){*{transition:none!important}}

['Body paragraph: PEEL',`<p><b>P</b>oint → <b>E</b>xplain → <b>E</b>xample → <b>L</b>ink</p><p class=en><mark>Point:</mark> The strongest argument for public transport is its ability to relieve congestion. <mark>Explain:</mark> A single metro train can carry thousands of commuters, removing a substantial number of cars from the road. <mark>Example:</mark> In Singapore, for instance, heavy investment in rail has kept traffic manageable. <mark>Link:</mark> Consequently, the benefits extend well beyond the daily commute.</p><p>দুর্বল: <s>Public transport is good. Many people use it.</s> এখানে অস্পষ্ট শব্দ, উদাহরণ নেই।</p>`],
['Conclusion লেখা',`<p>নতুন যুক্তি নয়। মত আবার বলুন, শেষে ভারসাম্যপূর্ণ ভাবনা দিন।</p><p class=en>In conclusion, although roads cannot be ignored, public transport offers a more sustainable answer to urban congestion.</p><p class=en>On balance, investing in public transport is the wiser choice. The challenge is to strike a balance that serves both cities and rural areas.</p>`],
['১১টি বাক্য-গঠন প্যাটার্ন',`<ol><li>Although… <i>Although roads help, they cannot end congestion.</i></li><li>While / Whereas <i>While cars offer flexibility, trains move more people.</i></li><li>Not only… but also <i>Not only does rail cut pollution, but it also lowers costs.</i></li><li>V-ing phrase <i>Metro lines cut travel times, helping workers reach distant jobs.</i></li><li>Relative clause <i>Cities that invest in rail have cleaner air.</i></li><li>Conditional <i>If fares were subsidised, more commuters would use buses.</i></li><li>Passive <i>It is often argued that roads boost growth.</i></li><li>Cause–effect <i>Congestion stems from poor planning.</i></li><li>Concession <i>Admittedly, metros are costly; however, savings are substantial.</i></li><li>Emphasis <i>It is investment that reduces congestion.</i></li><li>Provided that / Unless <i>Rail succeeds provided that fares stay affordable.</i></li></ol>`],
['সাধারণ ভুল ও সময়',`<ul><li>মত অস্পষ্ট, বা প্রশ্নের একটি অংশ বাদ</li><li>মুখস্থ essay বা মুখস্থ বাক্য (পরীক্ষক ধরেন)</li><li>অস্পষ্ট উদাহরণ ("many", "some")</li><li>একই শব্দ বারবার (economic, important)</li><li>article ও subject–verb agreement-এর ভুল</li><li>কথ্যরীতি ও সংকোচন (don't, kids)</li><li>শেষে রিভিউ না করা</li></ul><p><mark>সময়:</mark> ৫ মিনিট পরিকল্পনা, ৩০ মিনিট লেখা, ৫ মিনিট রিভিউ।</p>`],
['চার ধরনের প্রশ্নের বিস্তারিত কাঠামো',`<p><b>১. Outweigh / Agree–Disagree</b></p><ul><li>Intro: পটভূমি + মত</li><li>B1: আপনার পক্ষের প্রধান যুক্তি + উদাহরণ</li><li>B2: বিপক্ষের ঝুঁকি স্বীকার + কেন তা গৌণ</li><li>Conclusion: মত পুনরায়</li></ul><p><b>২. Discuss both views + opinion</b></p><ul><li>Intro: <i>Some argue… while others…; I believe…</i></li><li>B1: প্রথম মতের সেরা যুক্তি + উদাহরণ</li><li>B2: দ্বিতীয় মত + আপনার অবস্থান কেন</li><li>Conclusion: মত + ভারসাম্যপূর্ণ শেষ বাক্য</li></ul><p><b>৩. Problem–Solution</b></p><ul><li>Intro: সমস্যার পটভূমি</li><li>B1: ২টি সমস্যা, কারণ বা ফলসহ</li><li>B2: ২টি সমাধান, প্রতিটি আলাদা সমস্যার উত্তর</li><li>Conclusion: সংক্ষিপ্ত সারাংশ</li></ul><p><b>৪. Two-part question</b></p><ul><li>Intro: বিষয় + উত্তরের সংকেত</li><li>B1: প্রথম প্রশ্নের উত্তর</li><li>B2: দ্বিতীয় প্রশ্নের উত্তর</li><li>Conclusion: দুটিকে জুড়ে সারাংশ</li></ul>`],
['প্রশ্ন বিশ্লেষণ: আরও উদাহরণ',`<p class=en>Do the advantages of online education outweigh the disadvantages?</p><ul><li>ধরন: Outweigh। মূল শব্দ: <i>advantages, outweigh</i></li><li>মত: সুবিধা বেশি। B1: নমনীয়তা ও কম খরচ। B2: ইন্টারনেট ও মনোযোগের ঝুঁকি, সমাধানসহ</li></ul><p class=en>Governments should spend on public transport rather than roads. Discuss both views and give your opinion.</p><ul><li>ধরন: Discuss both + opinion</li><li>B1 (সড়ক): গ্রামাঞ্চলের যাতায়াত, পণ্য পরিবহন</li><li>B2 (গণপরিবহন): যানজট ও দূষণ কমানো, কম খরচ</li><li>মত: গণপরিবহন অগ্রাধিকার, তবে সড়ক পুরো বাদ নয়</li></ul>`],
['Problem–Solution intro ও বিপক্ষের মত স্বীকার',`<p class=en>Obesity rates are rising in many countries. This trend stems from changing diets and sedentary lifestyles, but it can be reversed through coordinated action by governments and schools.</p><p>বিপক্ষের মত স্বীকার করে নিজের যুক্তি দাঁড় করান:</p><p class=en>Admittedly, roads remain essential for rural communities and freight transport. Nevertheless, this does not justify prioritising them in crowded cities, where each new road quickly fills with additional traffic.</p><p>Band 6 বনাম Band 8–9: <s>Public transport is good for cities. It is cheap.</s> → <i>Public transport reduces congestion and costs, which makes it a sustainable choice for crowded cities.</i></p>`],
['সাধারণ শব্দ → উন্নত শব্দ',`<ul><li>very important → <i>crucial, compelling</i></li><li>bad effect → <i>adverse impact</i></li><li>many people lose jobs → <i>workers face job insecurity</i></li><li>rich-poor gap → <i>widening inequality</i></li><li>depends on → <i>is heavily reliant on, is exposed to</i></li></ul><p>নতুন শব্দ শব্দজোড় (collocation) সহ শিখুন: <i>exacerbate congestion, mitigate pollution, net benefit</i>। অচেনা কঠিন শব্দ জোর করে ঢোকাবেন না।</p>`],
['মুখস্থ করার কৌশল ও সাপ্তাহিক রুটিন',`<ul><li>প্রতিদিন ৫টি শব্দ শিখুন, ২টি নিজের বাক্যে লিখুন।</li><li>মুখস্থ বাক্য নয়, <mark>প্যাটার্ন</mark> মুখস্থ করুন; বিষয় বদলে নতুন বাক্য বানান।</li><li>প্রতিটি essay-তে ৪–৫টি কানেক্টর ও ৫–৬টি নতুন শব্দ যথেষ্ট। বেশি ঠাসলে অস্বাভাবিক লাগে।</li></ul><p><mark>সাপ্তাহিক রুটিন:</mark></p><ol><li>সপ্তাহে ২টি প্রশ্নে শুধু ৫ মিনিটের পরিকল্পনা করুন।</li><li>একটি essay পুরো ৪০ মিনিটে লিখুন।</li><li>মডেলের সঙ্গে মিলিয়ে ৩টি উন্নতির জায়গা বের করে আবার লিখুন।</li><li>সপ্তাহে ১০টি নতুন শব্দজোড় শিখে পরের essay-তে ব্যবহার করুন।</li></ol>`]];
const P=['Some people think governments should spend money on public transport rather than building more roads. Discuss both views and give your opinion.','Do the advantages of online education outweigh the disadvantages?','Obesity rates are rising in many countries. What are the causes, and what can be done?','Globalisation has brought economic benefits to Asia but also serious problems. To what extent do you agree?'];
const CK=['প্রশ্নের সব অংশের উত্তর দিয়েছি','শুরুতেই স্পষ্ট মত আছে','প্রতি অনুচ্ছেদে একটি ধারণা ও নির্দিষ্ট উদাহরণ আছে','সমস্যার সঙ্গে মিলিয়ে সমাধান দিয়েছি','একই শব্দ বারবার বসাইনি','article ও verb-এর ভুল খুঁজে দেখেছি','conclusion-এ নতুন যুক্তি আনিনি'];
function prog(){const t=L.length+W.length,d=S.done.length+S.known.length;$('#pt').textContent=`পাঠ ${bn(S.done.length)}/${bn(L.length)} · শব্দ ${bn(S.known.length)}/${bn(W.length)}`;$('#pf').style.width=d/t*100+'%'}
/* পাঠ */
$('#p0').innerHTML=`<div class=hero><p class=en><s>Public transport is good.</s></p><p class=en><mark>Public transport offers a sustainable answer to urban congestion.</mark></p><h2>দুর্বল বাক্য থেকে Band 8–9 বাক্যে</h2><p>প্রতিটি পাঠ এই উত্তরণই শেখায়। এভাবে এগোন:</p><ol class=route><li>পাঠ পড়ে "শেষ" চিহ্ন দিন</li><li>প্রতিদিন ৫টি শব্দ-কার্ড শিখুন</li><li>কুইজে নিজেকে যাচাই করুন</li><li>৪০ মিনিটে একটি essay লিখুন</li></ol></div>`+L.map((l,i)=>`<details class="${S.done.includes(i)?'done':''}"><summary>${bn(i+1)}. ${l[0]}</summary><div class=bd>${l[1]}<p><button class=btn data-d=${i}>${S.done.includes(i)?'শেষ করেছি ✓':'শেষ করেছি'}</button></p></div></details>`).join('');
$('#p0').onclick=e=>{const b=e.target.closest('[data-d]');if(!b)return;const i=+b.dataset.d,k=S.done.indexOf(i);k<0?S.done.push(i):S.done.splice(k,1);b.textContent=k<0?'শেষ করেছি ✓':'শেষ করেছি';b.closest('details').classList.toggle('done',k<0);save();prog()};
/* কার্ড */
let cat='all',ci=0,fl=false;
function cards(){const d=W.filter(w=>cat=='all'||w.g==cat),w=d[ci],kn=S.known.includes(w.w);
$('#p1').innerHTML=`<h2>শব্দ-কার্ড</h2><div class=chips>${['all',...Object.keys(GN)].map(g=>`<button class="chip ${g==cat?'on':''}" data-c=${g}>${g=='all'?'সব':GN[g]}</button>`).join('')}</div><div class=card tabindex=0 role=button id=cd>${fl?`<div class=m>${w.m}</div><p class=en>${w.e}</p>`:`<div class=w>${w.w}</div><div class=pr>${w.p}</div><div class=hint>উল্টাতে ট্যাপ করুন</div>`}</div><div class=row><button class=btn data-n=-1>‹ আগের</button><span>${bn(ci+1)}/${bn(d.length)}</span><button class=btn data-n=1>পরের ›</button></div><p><button class="btn ${kn?'on':''}" data-k=1>${kn?'জানি ✓':'এটি জানি'}</button></p>`;
$('#cd').onclick=()=>{fl=!fl;cards()};$('#cd').onkeydown=e=>{if(e.key=='Enter'||e.key==' '){e.preventDefault();fl=!fl;cards()}}}
$('#p1').onclick=e=>{const d=W.filter(w=>cat=='all'||w.g==cat),c=e.target.closest('[data-c]'),n=e.target.closest('[data-n]'),k=e.target.closest('[data-k]');
if(c){cat=c.dataset.c;ci=0;fl=false;cards()}else if(n){ci=(ci+ +n.dataset.n+d.length)%d.length;fl=false;cards()}else if(k){const w=d[ci].w,j=S.known.indexOf(w);j<0?S.known.push(w):S.known.splice(j,1);save();prog();cards()}};
/* কুইজ */
let Q=null;
function quiz(){if(!Q){$('#p2').innerHTML=`<h2>কুইজ</h2><p>অর্থ দেখে সঠিক ইংরেজি শব্দ বা ফ্রেজ বেছে নিন। মোট ১০টি প্রশ্ন।${S.best?` সেরা স্কোর: ${bn(S.best)}/১০`:''}</p><p><button class="btn pri" id="qs">শুরু করুন</button></p>`;$('#qs').onclick=()=>{Q={i:0,s:0,l:sh(W).slice(0,10),a:null};quiz()};return}
if(Q.i>=10){if(Q.s>S.best){S.best=Q.s;save()}$('#p2').innerHTML=`<h2>স্কোর: ${bn(Q.s)}/১০</h2><p>${Q.s>=8?'দারুণ! এবার ৪০ মিনিটে একটি essay লিখে ফেলুন।':'আবার শব্দ-কার্ড দেখে নিন, তারপর কুইজ দিন।'}</p><p><button class="btn pri" id="qs">আবার খেলুন</button></p>`;$('#qs').onclick=()=>{Q=null;quiz()};return}
const it=Q.l[Q.i],o=sh([it,...sh(W.filter(x=>x.g==it.g&&x.w!=it.w)).slice(0,3)]);
$('#p2').innerHTML=`<p class=hint>প্রশ্ন ${bn(Q.i+1)}/১০</p><h2>${it.m}</h2>${o.map(x=>`<button class=opt data-w="${x.w}">${x.w}</button>`).join('')}<div id=fb></div>`;
$('#p2').onclick=e=>{const b=e.target.closest('.opt');if(b&&Q.a===null){Q.a=b.dataset.w;const r=Q.a==it.w;if(r)Q.s++;document.querySelectorAll('.opt').forEach(x=>{if(x.dataset.w==it.w)x.classList.add('ok');else if(x==b)x.classList.add('bad')});$('#fb').innerHTML=`<p>${r?'সঠিক!':'ভুল।'} উচ্চারণ: ${it.p}</p><p class=en>${it.e}</p><button class="btn pri" id=nx>${Q.i==9?'ফল দেখুন':'পরের প্রশ্ন'}</button>`;$('#nx').onclick=()=>{Q.i++;Q.a=null;quiz()}}}}
/* লেখা */
let pi=0,tm=2400,iv=null;
function stats(){const t=$('#tx').value;S.draft=t;save();const w=(t.match(/[A-Za-z'’-]+/g)||[]).length,p=t.split(/\n\s*\n/).filter(x=>x.trim()).length,u=W.filter(x=>new RegExp('\\b'+x.w+'\\w*','i').test(t)),c=u.filter(x=>x.g=='c').length,o=u.length-c;
$('#sv').innerHTML=`<span class="${w>=280&&w<=320?'g':''}">শব্দ ${bn(w)} (লক্ষ্য ২৮০–৩২০)</span><span class="${p>=4&&p<=5?'g':''}">অনুচ্ছেদ ${bn(p)} (লক্ষ্য ৪–৫)</span><span class="${c>=4?'g':''}">কানেক্টর ${bn(c)} (৪+)</span><span class="${o>=5?'g':''}">নতুন শব্দ ${bn(o)} (৫+)</span>`;$('#us').textContent=u.length?'ব্যবহৃত: '+u.map(x=>x.w).join(', '):'এখনও কোনো মুখস্থ শব্দ ব্যবহার হয়নি।'}
function clk(){const m=Math.floor(tm/60),s=tm%60;$('#tm').textContent=bn(String(m).padStart(2,'0'))+':'+bn(String(s).padStart(2,'0'))}
function writer(){$('#p3').innerHTML=`<h2>লেখার অনুশীলন</h2><p class=en id=pq>${P[pi]}</p><div class=row><button class=btn id=np>অন্য প্রশ্ন</button><span class=tm id=tm></span><button class="btn pri" id=tb>টাইমার শুরু</button></div><textarea id=tx spellcheck=false placeholder="এখানে English-এ essay লিখুন…"></textarea><div class=st id=sv></div><p class=used id=us></p><h2>জমা দেওয়ার আগে</h2>${CK.map(c=>`<label class=ck><input type=checkbox> ${c}</label>`).join('')}`;
$('#tx').value=S.draft;$('#tx').oninput=stats;stats();clk();
$('#np').onclick=()=>{pi=(pi+1)%P.length;$('#pq').textContent=P[pi]};
$('#tb').onclick=()=>{if(iv){clearInterval(iv);iv=null;$('#tb').textContent='টাইমার শুরু'}else{$('#tb').textContent='থামান';iv=setInterval(()=>{if(--tm<=0){clearInterval(iv);iv=null;tm=0;$('#tb').textContent='সময় শেষ'}clk()},1000)}}}
/* ট্যাব */
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{const t=+b.dataset.t;document.querySelectorAll('nav button').forEach(x=>x.setAttribute('aria-selected',x==b));for(let i=0;i<4;i++)$('#p'+i).hidden=i!=t;if(t==1)cards();if(t==2)quiz();if(t==3&&!$('#tx'))writer();scrollTo(0,0)});
prog();
</script>
